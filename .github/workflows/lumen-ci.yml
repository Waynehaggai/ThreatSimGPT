name: Lumen CI

# Scoped to the Flutter app in lumen/ so it never runs on ThreatSimGPT changes.
on:
  push:
    branches: ["**"]
    paths: ["lumen/**", ".github/workflows/lumen-ci.yml"]
  pull_request:
    paths: ["lumen/**", ".github/workflows/lumen-ci.yml"]

defaults:
  run:
    working-directory: lumen

jobs:
  analyze-and-test:
    name: Format · Codegen · Analyze · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Generate code (Isar / Freezed / JSON / Riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: lumen-coverage
          path: lumen/coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android (debug, smoke)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Debug APK verifies the app compiles end-to-end for a real target.
      - run: flutter build apk --debug
